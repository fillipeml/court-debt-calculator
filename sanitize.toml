[brand]
terms = ["STG", "Schmeisser", "Terra Gomes", "stglaw", "RenavePro", "Renave", "Lagoa", "HJR", "ELAW"]

[domains]
internal = ["stglaw.com.br", "stgadvogados.com.br"]

[hosts]
suffixes = ["sharepoint.com", "onmicrosoft.com"]

[allow]
# lock files and dependency trees; the index files hold only public monthly percentages
paths = ["uv.lock", "web/package-lock.json", "web/node_modules/*", "web/node_modules/**/*", "web/.next/*", "web/.next/**/*", "indices/data/*"]
# The fictional case number is dated 2099 (a year no real case can carry) and carries invalid check digits.
patterns = ['\d{7}-\d{2}\.2099\.\d\.\d{2}\.\d{4}']
