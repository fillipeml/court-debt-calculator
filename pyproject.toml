[project]
name = "court-debt-calculator"
version = "0.1.0"
description = "Deterministic engine for updating court-ordered debts in Brazil (monetary adjustment, default interest, deductions, fees, enforcement surcharges) with official indices versioned in git, a FastAPI layer with LLM parameter extraction and a Next.js review UI"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Fillipe Loose" }]
keywords = ["legal-tech", "finance", "decimal", "fastapi", "claude-api", "brazil"]
dependencies = [
  "fastapi>=0.115",
  "python-multipart>=0.0.9",
  "anthropic>=1.8",
  "pydantic>=2.13",
  "reportlab>=4",
  "openpyxl>=3.1",
]

[project.scripts]
debt-engine = "debt_engine.cli:main"
update-indices = "debt_engine.ingest:main"
debt-api = "debt_api.serve:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27", "pypdf>=5", "uvicorn[standard]>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/debt_engine", "src/debt_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.pycodestyle]
max-line-length = 130  # the formatter wraps code at 100; long string literals may reach 130

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
